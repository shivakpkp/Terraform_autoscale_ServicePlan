name: Reusable Terraform Security
description: Scan Terraform code for security issues with Checkov

inputs:
  working-directory:
    description: Terraform root directory
    required: true
    type: string
  terraform-version:
    description: Terraform CLI version
    required: true
    type: string
  scan-directory:
    description: Directory containing Terraform code
    required: true
    type: string

runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        persist-credentials: false

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ inputs.terraform-version }}

    - name: Install Checkov
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/checkov-venv"
        "$RUNNER_TEMP/checkov-venv/bin/python" -m pip install "checkov==3.2.495"

    - name: Scan Terraform security
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCAN_DIRECTORY: ${{ inputs.scan-directory }}
      run: |
        "$RUNNER_TEMP/checkov-venv/bin/checkov" \
          --directory "$SCAN_DIRECTORY" \
          --framework terraform \
          --soft-fail \
          --output github_failed_only \
          > "$RUNNER_TEMP/checkov-report.md"

    - name: Publish security summary
      if: always()
      shell: bash
      run: |
        {
          echo "## Terraform security findings"
          echo ""
          echo "Advisory scan: findings do not block this pipeline."
          echo ""

          if [ -s "$RUNNER_TEMP/checkov-report.md" ]; then
            cat "$RUNNER_TEMP/checkov-report.md"
          else
            echo "No report was produced. Check the scan logs."
          fi
        } >> "$GITHUB_STEP_SUMMARY"