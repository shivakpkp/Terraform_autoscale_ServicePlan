name: Terraform Destroy
description: Destroy Terraform configuration using a previously generated plan file.

inputs:
  working-directory:
    description: Terraform root directory
    required: true
    type: string
  terraform-version:
    description: Terraform CLI version
    required: true
    type: string
  

runs:
  using: "composite"

  steps:
    - name: Checkout repository
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        persist-credentials: false

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

    - name: create provider cache directory
      shell: bash
      run: |
        mkdir -p "$TF_PLUGIN_CACHE_DIR"

    - name: Check terraform Provider
      uses: actions/cache@v6.1.0
      with:
        path: ${{ env.TF_PLUGIN_CACHE_DIR }}
        key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('environment/POC/.terraform.lock.hcl') }}

    - name: Check Azure authentication variables
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        for name in STATE_RESOURCE_GROUP_NAME STATE_STORAGE_ACCOUNT STATE_CONTAINER STATE_KEY; do
          if [ -z "${!name}" ]; then
            echo "::error::$name is missing or empty inside the composite action"
            exit 1
          fi
          echo "$name is available"
        done
    
    - name: Terraform init
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        terraform init -input=false \
          -backend-config="resource_group_name=$RESOURCE_GROUP_NAME" \
          -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
          -backend-config="container_name=$STATE_CONTAINER" \
          -backend-config="key=$STATE_KEY"

    - name: Terraform plan
      id: terraform-plan
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
          exit_code=0
          terraform plan -destroy -input=false -detailed-exitcode -out=tfplan-destroy || exit_code=$?
          case "$exit_code" in
            0)
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Terraform plan failed."
              exit "$exit_code"
              ;;
          esac
          
    - name: Show has Change result
      shell: bash
      run: |
        echo "has_changes=${{ steps.terraform-plan.outputs.has_changes }}"

    - name: archive plan output
      uses: actions/upload-artifact@v7
      with:
        name: tfplan-destroy
        path: ${{ inputs.working-directory }}/tfplan-destroy
   
