name: Terraform Plan POC

on:
  workflow_dispatch:
  push:
    paths:
      - 'environment/**'
      - '.github/workflows/terraform-plan.yml'

permissions:
  contents: read

concurrency:
  group: terraform-state-poc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: POC

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    defaults:
      run:
        shell: bash
        working-directory: environment/POC

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.5.7"
          terraform_wrapper: false

      - name: Check Azure authentication variables
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
        run: |
          missing=0

          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -n "${!name}" ]; then
              echo "$name is set"
            else
              echo "::error::$name is missing or empty"
              missing=1
            fi
          done

          exit "$missing"
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.ARM_CLIENT_ID }}",
              "clientSecret": "${{ secrets.ARM_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.ARM_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.ARM_TENANT_ID }}"
            }

      - name: Initialize remote state
        env:
          ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

          STATE_RESOURCE_GROUP: ${{ vars.TF_RESOURCE_GROUP_NAME }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: environment/POC
          terraform-version: "1.5.7"
