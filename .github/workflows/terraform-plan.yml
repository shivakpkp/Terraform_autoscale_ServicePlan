name: Reusable Terraform Plan

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      terraform-version:
        required: true
        type: string
      environment-name:
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ${{ inputs.environment-name }}

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
    
      - name: Check Azure authentication variables
        run: |
          missing=0

          for name in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing or empty"
              missing=1
            else
              echo "$name is set"
            fi
          done

          exit "$missing"

      - name: Initialize remote state
        env:
          STATE_RESOURCE_GROUP: ${{ vars.TF_RESOURCE_GROUP_NAME }}
          STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
          STATE_KEY: ${{ vars.TF_STATE_KEY }}
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      - name: Terraform plan
        run: terraform plan -input=false -no-color -lock-timeout=5m